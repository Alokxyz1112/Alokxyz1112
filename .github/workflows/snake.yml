name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_background=#F4F1EA&color_snake=#C8772E&color_dots=#EBE6DC,#E3CDB4,#D9A66F,#C8772E,#8F5220
            dist/snake-dark.svg?palette=github-dark&color_snake=#C8772E&color_dots=#1E1C1A,#4A3420,#7A4E26,#A8642A,#C8772E&color_background=#121212
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
